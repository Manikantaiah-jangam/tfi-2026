<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Form</title>
    <style>
        form{
            background-color: cyan;
            color: blue;
            text-align: center;
            padding: 15px;
            border-radius: 10px;
            transition: 0.5s;
        }
        body{
            background-color: black;
        }
        div{
            margin: 50px auto;
            width: 300px;
            height: 700px;
        }
        form:hover{
            background-color:wheat;
            color: black;
        }
        input{
            background-color: blanchedalmond;
            color: black;
        }
        a{
            text-decoration: none;
            color: black;
            transition: 1s;
        }
        a:hover{
            color:white;
        }
        button{
            border-radius: 5px;
            transition: 1s;
            cursor: pointer;
        }
        button:hover{
            background-color: black;
            color: white;
        }
    </style>
</head>
<body>
    <div>
        <form method="get">
            <h2>Login Form</h2>
            <label for="uname">User Name</label>
            <input type="text" name="uname" id="uname"><br/><br/>
            <label for="pwd">Password</label>
            <input type="text" name="pwd" id="pwd"><br/><br/>
            <button type="submit" id="confirm" onclick="prompt('are you agree with T&C')">Login</button>
            <button><a href="register.html">Register</a></button>

            <script>
                b=getElementById('confirm')
                document.write(b)
            </script>

        </form>
    </div>
</body>
</html>
