<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div>
        <form method="get">
            <h2>Registration Form</h2>
            <label for="fname">Full Name</label>
            <input type="text" name="fname" id="fname"><br/><br/>
            <label for="email">Email</label>
            <input type="email" name="email" id="email"><br/><br/>
            <label for="phn">Phone Num</label>
            <input type="tel" name="phn" id="phn"><br/><br/>
            <label for="pwd">Password</label>
            <input type="text" name="pwd" id="pwd"><br/><br/>
            <label for="rpwd">Confirm Password</label>
            <input type="text" name="rpwd" id="rpwd"><br/><br/>
            <button type="submit">Register</button>
            <button><a href="login_form.html">Login</a></button>

        </form>
    </div>
</body>
</html>
